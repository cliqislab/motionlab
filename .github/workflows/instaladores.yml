name: Gerar instaladores MotionLab
on:
  workflow_dispatch:
  push:
    tags: ['installer-v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            name: Windows
          - os: macos-latest
            command: dist:mac
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Instalar dependências
        working-directory: installer
        run: npm ci
      - name: Gerar instalador
        working-directory: installer
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MotionLab-${{ matrix.name }}
          path: dist/instaladores/*
          if-no-files-found: error
