<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionLab — Seu primeiro vídeo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}
body{margin:0;padding:22px;background:#0d162a;color:#edf4ff;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;color:#80e6d2}
small{color:#a6bad2}.bar{background:#2b3955;height:6px;border-radius:6px;margin:20px 0}.progress{background:#35ccb8;width:33%;height:100%;border-radius:6px}
h2{font-size:20px;margin:10px 0}p{color:#bcc9db}
.example{padding:15px;border-radius:9px;background:#1d2a43;white-space:pre-wrap;color:#e8f3ff;margin:16px 0}
button{border:0;background:#38cfb8;color:#092621;font-weight:bold;padding:11px;border-radius:9px;cursor:pointer}
.secondary{background:#2b3d5c;color:white}
.actions{display:flex;gap:9px;justify-content:space-between;margin-top:20px}
</style></head><body>
<header><strong>🎬 MotionLab</strong><small id="counter">1 de 3</small></header>
<div class="bar"><div class="progress" id="progress"></div></div>
<h2 id="title"></h2><p id="detail"></p><div class="example" id="example"></div>
<button class="secondary" id="copy">Copiar exemplo</button>
<div class="actions"><button class="secondary" id="back">Voltar</button><button id="next">Próximo passo</button></div>
<script>
const steps=[
{title:'Abra o terminal no VS Code',detail:'No menu superior do VS Code, clique em Terminal → Novo Terminal. O terminal deve abrir na pasta MotionLab Kit.',example:'Se não encontrar: menu Terminal → Novo Terminal.'},
{title:'Inicie o Claude Code',detail:'No terminal, digite o comando abaixo e pressione Enter. Se for sua primeira vez, siga as instruções de login.',example:'claude'},
{title:'Peça seu primeiro vídeo',detail:'Você decide estilo, narração, formato e referências no pedido. Coloque suas imagens de referência no projeto e diga o nome da pasta ao Claude. Efeitos 3D dependem das ferramentas disponíveis; a chave Gemini é apenas para narração.',example:'Crie um vídeo vertical de 30 segundos para minha empresa, com visual moderno. Use as imagens que eu colocar na pasta referencias como inspiração visual. Se houver chave Gemini configurada, gere narração natural com a voz Fenrir e sincronize com as cenas. Exporte um MP4.'}
];
let step=0;const $=id=>document.getElementById(id);
function draw(){const s=steps[step];$('title').textContent=s.title;$('detail').textContent=s.detail;$('example').textContent=s.example;$('counter').textContent=(step+1)+' de 3';$('progress').style.width=(100*(step+1)/3)+'%';$('back').disabled=step===0;$('next').textContent=step===2?'Recomeçar':'Próximo passo';}
$('back').onclick=()=>{step=Math.max(0,step-1);draw();};
$('next').onclick=()=>{step=(step+1)%3;draw();};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(steps[step].example);$('copy').textContent='Copiado!';setTimeout(()=>$('copy').textContent='Copiar exemplo',1500);}catch{$('copy').textContent='Selecione e copie o texto acima';}};
draw();
</script></body></html>
