<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionLab — Guia flutuante</title><link rel="stylesheet" href="theme.css"></head><body class="guide-body"><header><div class="brand"><span class="brandmark">M</span> MOTIONLAB</div><span class="tag" id="counter">1 / 3</span></header><nav class="guide-links" aria-label="Menu do MotionLab"><button class="secondary" id="tutorials">📖 Tutoriais</button><button class="secondary" id="library">✦ Biblioteca</button></nav><div class="bar"><div class="progress" id="progress" style="width:33%"></div></div><p class="eyebrow">Sua primeira criação</p><h2 id="title"></h2><p id="detail"></p><div class="example" id="example"></div><button class="secondary" id="copy">Copiar exemplo</button><div class="actions"><button class="secondary" id="back">Anterior</button><button id="next">Próximo passo</button></div><p style="font-size:12px">O menu acima fica disponível durante todo o processo.</p><script>const steps=[{title:'Abra o terminal',detail:'No VS Code, clique em Terminal → Novo Terminal. Confira se está na pasta MotionLab Kit.',example:'Terminal → Novo Terminal'},{title:'Entre no Claude Code',detail:'Digite claude no terminal. No primeiro acesso, conclua o login na sua conta.',example:'claude'},{title:'Crie com uma ideia',detail:'Abra a Biblioteca, copie um prompt e cole no Claude Code. Para imagens e cortes, siga os Tutoriais. Peça prévias antes de renderizar.',example:'Use /motion e crie um comercial vertical de 20 segundos para minha marca. Primeiro mostre roteiro, 3 styleframes e prévia. Aguarde minha aprovação antes do MP4.'}];let step=0;const $=id=>document.getElementById(id);function draw(){const s=steps[step];$('title').textContent=s.title;$('detail').textContent=s.detail;$('example').textContent=s.example;$('counter').textContent=(step+1)+' / 3';$('progress').style.width=((step+1)*100/3)+'%';$('back').disabled=step===0;$('next').textContent=step===2?'Recomeçar':'Próximo passo';}$('back').onclick=()=>{step=Math.max(0,step-1);draw()};$('next').onclick=()=>{step=(step+1)%3;draw()};$('copy').onclick=async()=>{try{await window.motionlab.copyText(steps[step].example);$('copy').textContent='Copiado!';}catch(e){$('copy').textContent='Selecione o texto para copiar';}};$('tutorials').onclick=()=>window.motionlab.openTutorials();$('library').onclick=()=>window.motionlab.openLibrary();draw();</script></body></html>
